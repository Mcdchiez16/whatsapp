# fly.toml app configuration file generated for atcis-whatsapp on 2026-03-18
# See https://fly.io/docs/reference/configuration/ for information

app = "atcis-whatsapp"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "wa_auth_vol"
  destination = "/app/.wa_auth_sessions"

[env]
  PORT = "3001"
  # Keys should be set via 'fly secrets set'
